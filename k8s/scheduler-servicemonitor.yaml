apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: scheduler
  namespace: cattle-monitoring-system  # must match Prometheus namespace
  labels:
    release: rancher-monitoring        # must match Prometheus label
spec:
  selector:
    matchLabels:
      app: scheduler                  # must match your Service labels
  namespaceSelector:
    matchNames:
      - default                     # where your gateway Service actually runs
  endpoints:
    - port: http                    # must match Service port name
      path: /metrics
      interval: 15s
