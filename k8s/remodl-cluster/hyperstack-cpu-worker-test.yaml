#cloud-config

# HyperStack Cloud-Init Configuration
# Built collaboratively - add steps below

# Run commands during first boot
runcmd:
  # 1. Install Tailscale
  - ['sh', '-c', 'curl -fsSL https://tailscale.com/install.sh | sudo sh']

  # 2. Authenticate Tailscale
  - ['sudo', 'tailscale', 'up', '--auth-key=tskey-auth-kvpjzfEAVW11CNTRL-zNQhTGW5MriFtR8XtBLTrie9o9eUrH3DU', '--ssh']



  # 4. Get Tailscale IP and set as environment variable
  - ['sh', '-c', 'echo "TAILSCALE_IP=$(tailscale ip -4)" | sudo tee -a /etc/environment']

  # 5. Verify GPU resources
  - ['sudo', 'nvidia-smi', '-L']

  # 6. Detect GPU info and create k3s config
  - |
      #!/bin/bash
      # Wait for Tailscale to be fully up
      sleep 5

      # Get Tailscale IP
      TAILSCALE_IP=$(tailscale ip -4)

     
      # Create k3s config directory
      sudo mkdir -p /etc/rancher/k3s

      # Create k3s config.yaml
      echo "node-ip: ${TAILSCALE_IP}" | sudo tee /etc/rancher/k3s/config.yaml > /dev/null
      echo "flannel-iface: tailscale0" | sudo tee -a /etc/rancher/k3s/config.yaml > /dev/null
      
      

      

  # 7. Install and join k3s cluster with generated node name
  - |
      #!/bin/bash
      # Wait for k3s config to be created
      sleep 2

      # Get GPU info from the config we just created
      

      # Generate random 3-character alphanumeric string (lowercase)
      RANDOM_ID=$(cat /dev/urandom | tr -dc 'a-z0-9' | fold -w 3 | head -n 1)

      # Construct node name
      NODE_NAME="inferx-cpu-worker-${RANDOM_ID}"

      echo "Joining k3s cluster as node: ${NODE_NAME}"

      # Install k3s agent and join cluster
      # Note: K3S_URL points to control plane Tailscale IP for initial join
      # After cloud-init, manually rejoin with external IP flags for cross-cloud (see LEARNINGS.md)
      curl -sfL https://get.k3s.io | K3S_URL=https://100.65.227.120:6443 \
      K3S_TOKEN=K10f34afe5ee273ea04d1d3ad746e1b19ae135b1cf27b10d396ad9f0436a81819c8::server:a0386b56edc4a846e2a085b7920b6d89 \
      INSTALL_K3S_EXEC="--docker --with-node-id --node-name=${NODE_NAME}" sh -
      sudo systemctl stop k3s
      sudo k3s agent --docker --with-node-id --node-name=${NODE_NAME} \
      --server https://100.65.227.120:6443 \
      --token K10f34afe5ee273ea04d1d3ad746e1b19ae135b1cf27b10d396ad9f0436a81819c8::server:a0386b56edc4a846e2a085b7920b6d89 \
      --debug
      