#cloud-config

# HyperStack Cloud-Init Configuration
# Built collaboratively - add steps below

# Run commands during first boot
runcmd:
  # 1. Install Tailscale
  - ['sh', '-c', 'curl -fsSL https://tailscale.com/install.sh | sudo sh']

  # 2. Authenticate Tailscale
  - ['sudo', 'tailscale', 'up', '--auth-key=tskey-auth-kLpaaau9Vc11CNTRL-fysPfdLK7V1tCC5UmZ8DV1HqEznKWeUy', '--ssh']



  # 4. Get Tailscale IP and set as environment variable
  - ['sh', '-c', 'echo "TAILSCALE_IP=$(tailscale ip -4)" | sudo tee -a /etc/environment']

  # 5. Install Docker
  - ['sh', '-c', 'curl -fsSL https://get.docker.com | sudo sh']
  - ['sudo', 'systemctl', 'enable', 'docker']
  - ['sudo', 'systemctl', 'start', 'docker']
  - ['sudo', 'usermod', '-aG', 'docker', 'ubuntu']

  # 6. Get network interface IPs and create k3s config
  - |
      #!/bin/bash
      sleep 5
      VPC_IP=$(ip -4 addr show ens3 | grep -oP '(?<=inet\s)\d+(\.\d+){3}')
      TAILSCALE_IP=$(tailscale ip -4)
      echo "VPC IP: ${VPC_IP}"
      echo "Tailscale IP: ${TAILSCALE_IP}"
      sudo mkdir -p /etc/rancher/k3s
      cat > /tmp/k3s-config.yaml << 'K3SCONFIG'
      node-external-ip: TAILSCALE_IP_PLACEHOLDER
      flannel-iface: ens3
      kubelet-arg:
        - "node-labels=topology.kubernetes.io/zone=hyperstack"
        - "node-labels=topology.kubernetes.io/region=hyperstack"
        - "node-labels=node.kubernetes.io/instance-type=cpu"
        - "node-labels=cloud=hyperstack"
      K3SCONFIG
      sed "s/TAILSCALE_IP_PLACEHOLDER/${TAILSCALE_IP}/" /tmp/k3s-config.yaml | sudo tee /etc/rancher/k3s/config.yaml > /dev/null

  # 7. Create Tailscale route service
  - |
      #!/bin/bash
      printf '[Unit]\nDescription=Route Tailscale subnet via tailscale0\nAfter=tailscaled.service network-online.target\nWants=tailscaled.service\n\n[Service]\nType=oneshot\nExecStartPre=/bin/sleep 5\nExecStart=/bin/bash -c "/sbin/ip route add 100.64.0.0/10 dev tailscale0 || true"\nRemainAfterExit=yes\nExecStop=/bin/bash -c "/sbin/ip route del 100.64.0.0/10 dev tailscale0 || true"\n\n[Install]\nWantedBy=multi-user.target\n' | sudo tee /etc/systemd/system/tailscale-route.service > /dev/null
      sudo systemctl daemon-reload
      sudo systemctl enable tailscale-route.service

  # 8. Join k3s cluster with proper node configuration
  - |
      #!/bin/bash
      # Wait for k3s config to be created
      sleep 2

      # Get VPC IP for node name
      VPC_IP=$(ip -4 addr show ens3 | grep -oP '(?<=inet\s)\d+(\.\d+){3}')

      # Generate random 3-character alphanumeric string (lowercase)
      RANDOM_ID=$(cat /dev/urandom | tr -dc 'a-z0-9' | fold -w 3 | head -n 1)

      # Construct node name
      NODE_NAME="hyperstack-cpu-worker-${RANDOM_ID}"

      echo "Joining k3s cluster as node: ${NODE_NAME}"
      echo "VPC IP: ${VPC_IP}"

      # Add node-name to config.yaml
      echo "node-name: ${NODE_NAME}" | sudo tee -a /etc/rancher/k3s/config.yaml > /dev/null

      # Install k3s agent and join cluster
      # All configuration is in /etc/rancher/k3s/config.yaml
      curl -sfL https://get.k3s.io | \
        K3S_URL=https://100.65.227.120:6443 \
        K3S_TOKEN=K10f34afe5ee273ea04d1d3ad746e1b19ae135b1cf27b10d396ad9f0436a81819c8::server:a0386b56edc4a846e2a085b7920b6d89 \
        sh -s - agent --docker

      echo "Node joined successfully"