#cloud-config

# HyperStack Cloud-Init Configuration
# Built collaboratively - add steps below

# Run commands during first boot
runcmd:
  # 1. Ensure sudo is installed and available
  - ['apt-get', 'update']
  - ['apt-get', 'install', '-y', 'sudo']

  # 2. Install Tailscale
  - ['sh', '-c', 'curl -fsSL https://tailscale.com/install.sh | sudo sh']

  # 3. Authenticate Tailscale
  - ['sudo', 'tailscale', 'up', '--auth-key=tskey-auth-krHBv2re3M11CNTRL-E2KiNyZ68DKmjY6xY41eCKW5zVifRWVi', '--ssh']



  # 4. Get Tailscale IP and set as environment variable
  - ['sh', '-c', 'echo "TAILSCALE_IP=$(tailscale ip -4)" | sudo tee -a /etc/environment']

  # 5. Verify GPU resources
  - ['sudo', 'nvidia-smi', '-L']

  # 6. Detect GPU info and create k3s config
  - |
      #!/bin/bash
      # Wait for Tailscale to be fully up
      sleep 5

      # Get Tailscale IP
      TAILSCALE_IP=$(tailscale ip -4)

      # Detect GPU type and count
      GPU_INFO=$(sudo nvidia-smi --query-gpu=name --format=csv,noheader | head -1)
      GPU_COUNT=$(sudo nvidia-smi --query-gpu=name --format=csv,noheader | wc -l)

      # Determine GPU type label
      if echo "$GPU_INFO" | grep -qi "A6000"; then
        GPU_TYPE="a6000"
        NVLINK="true"
      elif echo "$GPU_INFO" | grep -qi "RTX 6000"; then
        GPU_TYPE="rtx6000"
        NVLINK="true"
      elif echo "$GPU_INFO" | grep -qi "L40"; then
        GPU_TYPE="l40"
        NVLINK="false"
      elif echo "$GPU_INFO" | grep -qi "H100"; then
        GPU_TYPE="h100"
        NVLINK="true"
      elif echo "$GPU_INFO" | grep -qi "A100"; then
        GPU_TYPE="a100"
        NVLINK="true"
      else
        GPU_TYPE="unknown"
        NVLINK="false"
      fi

      # Get VPC IP from ens3
      VPC_IP=$(ip -4 addr show ens3 | grep -oP '(?<=inet\s)\d+(\.\d+){3}')

      echo "VPC IP: ${VPC_IP}"
      echo "Tailscale IP: ${TAILSCALE_IP}"
      echo "GPU type: ${GPU_TYPE}, count: ${GPU_COUNT}, nvlink: ${NVLINK}"

      # Create k3s config directory
      sudo mkdir -p /etc/rancher/k3s

      # Create k3s config.yaml with dual IPs and VPC networking
      echo "node-external-ip: ${TAILSCALE_IP}" | sudo tee /etc/rancher/k3s/config.yaml > /dev/null
      echo "flannel-iface: ens3" | sudo tee -a /etc/rancher/k3s/config.yaml > /dev/null
      echo "kubelet-arg:" | sudo tee -a /etc/rancher/k3s/config.yaml > /dev/null
      echo "  - \"node-labels=topology.kubernetes.io/zone=hyperstack\"" | sudo tee -a /etc/rancher/k3s/config.yaml > /dev/null
      echo "  - \"node-labels=topology.kubernetes.io/region=hyperstack\"" | sudo tee -a /etc/rancher/k3s/config.yaml > /dev/null
      echo "  - \"node-labels=node.kubernetes.io/instance-type=gpu\"" | sudo tee -a /etc/rancher/k3s/config.yaml > /dev/null
      echo "  - \"node-labels=inferx_nodeType=inferx_file\"" | sudo tee -a /etc/rancher/k3s/config.yaml > /dev/null
      echo "  - \"node-labels=inferx_storage=data\"" | sudo tee -a /etc/rancher/k3s/config.yaml > /dev/null
      echo "  - \"node-labels=cloud=hyperstack\"" | sudo tee -a /etc/rancher/k3s/config.yaml > /dev/null
      echo "  - \"node-labels=gpu.type=${GPU_TYPE}\"" | sudo tee -a /etc/rancher/k3s/config.yaml > /dev/null
      echo "  - \"node-labels=gpu.count=${GPU_COUNT}\"" | sudo tee -a /etc/rancher/k3s/config.yaml > /dev/null
      echo "  - \"node-labels=nvlink=${NVLINK}\"" | sudo tee -a /etc/rancher/k3s/config.yaml > /dev/null
      echo "  - \"register-with-taints=nvidia.com/gpu=true:NoSchedule\"" | sudo tee -a /etc/rancher/k3s/config.yaml > /dev/null

  # 7. Create Tailscale route service for cross-zone routing
  - |
      #!/bin/bash
      printf '[Unit]\nDescription=Route Tailscale subnet via tailscale0\nAfter=tailscaled.service network-online.target\nWants=tailscaled.service\n\n[Service]\nType=oneshot\nExecStartPre=/bin/sleep 5\nExecStart=/bin/bash -c "/sbin/ip route add 100.64.0.0/10 dev tailscale0 || true"\nRemainAfterExit=yes\nExecStop=/bin/bash -c "/sbin/ip route del 100.64.0.0/10 dev tailscale0 || true"\n\n[Install]\nWantedBy=multi-user.target\n' | sudo tee /etc/systemd/system/tailscale-route.service > /dev/null
      sudo systemctl daemon-reload
      sudo systemctl enable tailscale-route.service
      sudo systemctl start tailscale-route.service
      echo "Tailscale route service created and enabled"

  # 8. Join k3s cluster with generated node name
  - |
      #!/bin/bash
      sleep 2

      # Get GPU info from the config we just created
      GPU_TYPE=$(grep 'gpu.type=' /etc/rancher/k3s/config.yaml | sed 's/.*gpu.type=//' | tr -d '"')
      GPU_COUNT=$(grep 'gpu.count=' /etc/rancher/k3s/config.yaml | sed 's/.*gpu.count=//' | tr -d '"')

      # Generate random 3-character alphanumeric string (lowercase)
      RANDOM_ID=$(cat /dev/urandom | tr -dc 'a-z0-9' | fold -w 3 | head -n 1)

      # Construct node name
      NODE_NAME="inferx-gpu-worker-${RANDOM_ID}-${GPU_TYPE}-${GPU_COUNT}"

      echo "Joining k3s cluster as node: ${NODE_NAME}"

      # Add node-name to config.yaml
      echo "node-name: ${NODE_NAME}" | sudo tee -a /etc/rancher/k3s/config.yaml > /dev/null

      # Install k3s agent and join cluster
      # All configuration is in /etc/rancher/k3s/config.yaml
      curl -sfL https://get.k3s.io | \
        K3S_URL=https://100.65.227.120:6443 \
        K3S_TOKEN=K10f34afe5ee273ea04d1d3ad746e1b19ae135b1cf27b10d396ad9f0436a81819c8::server:a0386b56edc4a846e2a085b7920b6d89 \
        sh -s - agent --docker

      echo "Node ${NODE_NAME} joined successfully"

  # 9. Install goofys for MinIO S3 bucket mounting
  - |
      #!/bin/bash
      echo "Installing goofys..."

      # Download and install goofys
      wget https://github.com/kahing/goofys/releases/latest/download/goofys -O /tmp/goofys
      sudo install /tmp/goofys /usr/local/bin/
      rm /tmp/goofys

      echo "goofys installed successfully"

  # 10. Create InferX directory structure
  - ['sudo', 'mkdir', '-p', '/opt/inferx/cache']
  - ['sudo', 'mkdir', '-p', '/opt/inferx/snapshot']
  - ['sudo', 'mkdir', '-p', '/opt/inferx/work']
  - ['sudo', 'mkdir', '-p', '/opt/inferx/log']
  - ['sudo', 'mkdir', '-p', '/opt/inferx/data']
  - ['sudo', 'mkdir', '-p', '/opt/inferx/run']
  - ['sudo', 'mkdir', '-p', '/ephemeral/inferx/dind']

  # 11. Create systemd mount unit for MinIO cache bucket
  - |
      #!/bin/bash
      cat <<'EOF' | sudo tee /etc/systemd/system/opt-inferx-cache.mount
      [Unit]
      Description=Mount MinIO Hyperstack cache bucket
      After=network-online.target
      Wants=network-online.target

      [Mount]
      What=minio-hyperstack#cache
      Where=/opt/inferx/cache
      Type=goofys
      Options=_netdev,allow_other,--endpoint=https://minio.minio-hyperstack.svc.cluster.local,--stat-cache-ttl=1m0s,--type-cache-ttl=1m0s

      [Install]
      WantedBy=multi-user.target
      EOF

  # 12. Create systemd mount unit for MinIO snapshots bucket
  - |
      #!/bin/bash
      cat <<'EOF' | sudo tee /etc/systemd/system/opt-inferx-snapshot.mount
      [Unit]
      Description=Mount MinIO Hyperstack snapshots bucket
      After=network-online.target
      Wants=network-online.target

      [Mount]
      What=minio-hyperstack#snapshots
      Where=/opt/inferx/snapshot
      Type=goofys
      Options=_netdev,allow_other,--endpoint=https://minio.minio-hyperstack.svc.cluster.local,--stat-cache-ttl=1m0s,--type-cache-ttl=1m0s

      [Install]
      WantedBy=multi-user.target
      EOF

  # 13. Create MinIO credentials file for goofys
  - |
      #!/bin/bash
      # Wait for k3s to be ready and MinIO service to be available
      echo "Waiting for MinIO service to be available..."

      # Create credentials file
      sudo mkdir -p /root/.aws
      cat <<'EOF' | sudo tee /root/.aws/credentials
      [default]
      aws_access_key_id = admin
      aws_secret_access_key = InferX-MinIO-Hyperstack-2025
      EOF

      sudo chmod 600 /root/.aws/credentials

  # 14. Enable and start MinIO mounts (will auto-mount after network is ready)
  - ['sudo', 'systemctl', 'daemon-reload']
  - ['sudo', 'systemctl', 'enable', 'opt-inferx-cache.mount']
  - ['sudo', 'systemctl', 'enable', 'opt-inferx-snapshot.mount']
