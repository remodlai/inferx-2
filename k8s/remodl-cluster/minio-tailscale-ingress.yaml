kind: Ingress
metadata:
  name: minio-hyperstack-console
  namespace: minio-hyperstack
  annotations:
    tailscale.com/funnel: "true"
    tailscale.com/backend-tls: "true"
spec:
  ingressClassName: tailscale
  tls:
  - hosts:
    - minio-hyperstack
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minio-hyperstack-console
            port:
              number: 9443
