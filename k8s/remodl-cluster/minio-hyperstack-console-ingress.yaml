apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-hyperstack-console
  namespace: minio-hyperstack
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`infra-hub-307.remodl.ai`) && PathPrefix(`/minio/hyperstack`)
      kind: Rule
      services:
        - name: minio-hyperstack-console
          port: 9443
      middlewares:
        - name: minio-hyperstack-strip-prefix
  tls:
    secretName: infra-hub-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: minio-hyperstack-strip-prefix
  namespace: minio-hyperstack
spec:
  stripPrefix:
    prefixes:
      - /minio/hyperstack
---
apiVersion: v1
kind: Secret
metadata:
  name: infra-hub-tls
  namespace: minio-hyperstack
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: infra-hub-tls
  namespace: minio-hyperstack
spec:
  secretName: infra-hub-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - infra-hub-307.remodl.ai
