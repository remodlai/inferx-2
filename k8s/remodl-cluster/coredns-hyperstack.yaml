apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns-hyperstack
  namespace: kube-system
  labels:
    k8s-app: kube-dns
    zone: hyperstack
    kubernetes.io/name: "CoreDNS"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      k8s-app: kube-dns
      zone: hyperstack
  template:
    metadata:
      labels:
        k8s-app: kube-dns
        zone: hyperstack
    spec:
      priorityClassName: system-cluster-critical
      serviceAccountName: coredns

      # Tolerate GPU taint
      tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      - effect: "NoSchedule"
        operator: "Exists"
      - effect: "NoExecute"
        operator: "Exists"

      # Pin to HyperStack nodes
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                - hyperstack

      containers:
      - name: coredns
        image: rancher/mirrored-coredns-coredns:1.12.3
        imagePullPolicy: IfNotPresent

        resources:
          limits:
            memory: 170Mi
          requests:
            cpu: 100m
            memory: 70Mi

        args: [ "-conf", "/etc/coredns/Corefile" ]

        volumeMounts:
        - name: config-volume
          mountPath: /etc/coredns
          readOnly: true

        ports:
        - containerPort: 53
          name: dns
          protocol: UDP
        - containerPort: 53
          name: dns-tcp
          protocol: TCP
        - containerPort: 9153
          name: metrics
          protocol: TCP

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - all
          readOnlyRootFilesystem: true

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 5

        readinessProbe:
          httpGet:
            path: /ready
            port: 8181
            scheme: HTTP
          initialDelaySeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 5

      dnsPolicy: Default

      volumes:
      - name: config-volume
        configMap:
          name: coredns
          items:
          - key: Corefile
            path: Corefile
