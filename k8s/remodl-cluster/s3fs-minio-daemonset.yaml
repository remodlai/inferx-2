---
apiVersion: v1
kind: Namespace
metadata:
  name: s3fs-minio
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-hyperstack-credentials
  namespace: s3fs-minio
type: Opaque
stringData:
  access-key: admin
  secret-key: InferX-MinIO-Hyperstack-2025
  endpoint: https://minio.minio-hyperstack.svc.cluster.local
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: s3fs-minio-mounts
  namespace: s3fs-minio
  labels:
    app: s3fs-minio
spec:
  selector:
    matchLabels:
      app: s3fs-minio
  template:
    metadata:
      labels:
        app: s3fs-minio
    spec:
      hostNetwork: true
      hostPID: true
      nodeSelector:
        cloud: hyperstack
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        # Ensure s3fs is installed on the host
        - name: install-s3fs
          image: ubuntu:22.04
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Checking if s3fs is installed on host..."

              # Check if s3fs exists on host
              if nsenter --target 1 --mount --uts --ipc --net --pid -- which s3fs 2>/dev/null; then
                echo "s3fs already installed on host"
                exit 0
              fi

              echo "Installing s3fs on host..."
              nsenter --target 1 --mount --uts --ipc --net --pid -- bash -c "
                apt-get update &&
                apt-get install -y s3fs &&
                s3fs --version
              "

              echo "s3fs installation complete"
          securityContext:
            privileged: true
          volumeMounts:
            - name: host-root
              mountPath: /host
      containers:
        - name: s3fs-cache-mount
          image: ubuntu:22.04
          command:
            - /bin/bash
            - -c
            - |
              set -e

              # Install s3fs in container for credential management
              apt-get update && apt-get install -y s3fs curl

              # Create credentials file
              echo "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" > /root/.passwd-s3fs
              chmod 600 /root/.passwd-s3fs

              # Ensure mount point exists on host
              mkdir -p /host/opt/inferx/cache

              # Unmount if already mounted (cleanup from previous run)
              if mountpoint -q /host/opt/inferx/cache 2>/dev/null; then
                echo "Unmounting existing cache mount..."
                umount /host/opt/inferx/cache || true
                sleep 2
              fi

              echo "Mounting cache bucket to /opt/inferx/cache..."
              s3fs cache /host/opt/inferx/cache \
                -o passwd_file=/root/.passwd-s3fs \
                -o url=${MINIO_ENDPOINT} \
                -o use_path_request_style \
                -o allow_other \
                -o umask=0000 \
                -o uid=0 \
                -o gid=0 \
                -o stat_cache_expire=60 \
                -o enable_content_md5 \
                -o parallel_count=8 \
                -o multipart_size=52 \
                -o dbglevel=info \
                -f

          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-hyperstack-credentials
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-hyperstack-credentials
                  key: secret-key
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: minio-hyperstack-credentials
                  key: endpoint
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
          volumeMounts:
            - name: host-opt-inferx-cache
              mountPath: /host/opt/inferx/cache
              mountPropagation: Bidirectional
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - mountpoint -q /host/opt/inferx/cache
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    echo "Unmounting cache..."
                    umount /host/opt/inferx/cache || true

        - name: s3fs-snapshot-mount
          image: ubuntu:22.04
          command:
            - /bin/bash
            - -c
            - |
              set -e

              # Install s3fs in container
              apt-get update && apt-get install -y s3fs curl

              # Create credentials file
              echo "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" > /root/.passwd-s3fs
              chmod 600 /root/.passwd-s3fs

              # Ensure mount point exists on host
              mkdir -p /host/opt/inferx/snapshot

              # Unmount if already mounted
              if mountpoint -q /host/opt/inferx/snapshot 2>/dev/null; then
                echo "Unmounting existing snapshot mount..."
                umount /host/opt/inferx/snapshot || true
                sleep 2
              fi

              echo "Mounting snapshots bucket to /opt/inferx/snapshot..."
              s3fs snapshots /host/opt/inferx/snapshot \
                -o passwd_file=/root/.passwd-s3fs \
                -o url=${MINIO_ENDPOINT} \
                -o use_path_request_style \
                -o allow_other \
                -o umask=0000 \
                -o uid=0 \
                -o gid=0 \
                -o stat_cache_expire=60 \
                -o enable_content_md5 \
                -o parallel_count=8 \
                -o multipart_size=52 \
                -o dbglevel=info \
                -f

          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-hyperstack-credentials
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-hyperstack-credentials
                  key: secret-key
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: minio-hyperstack-credentials
                  key: endpoint
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_ADMIN
          volumeMounts:
            - name: host-opt-inferx-snapshot
              mountPath: /host/opt/inferx/snapshot
              mountPropagation: Bidirectional
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - mountpoint -q /host/opt/inferx/snapshot
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    echo "Unmounting snapshots..."
                    umount /host/opt/inferx/snapshot || true

      volumes:
        - name: host-root
          hostPath:
            path: /
        - name: host-opt-inferx-cache
          hostPath:
            path: /opt/inferx/cache
            type: DirectoryOrCreate
        - name: host-opt-inferx-snapshot
          hostPath:
            path: /opt/inferx/snapshot
            type: DirectoryOrCreate

      restartPolicy: Always
