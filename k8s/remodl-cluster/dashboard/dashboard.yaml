apiVersion: apps/v1
kind: Deployment
metadata:
  name: inferx-dashboard
  labels:
    app: inferx-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inferx-dashboard
  template:
    metadata:
      labels:
        app: inferx-dashboard
    spec:
      nodeSelector:
        inferx-cpu-worker: "true"
      containers:
        - name: inferx-dashboard
          image: remodlai/inferx-dashboard:v0.1.5-custom-v9
          imagePullPolicy: Always
          env:
            - name: KEYCLOAK_URL
              value: "https://auth.remodl.ai"
            - name: KEYCLOAK_REALM_NAME
              value: "remodl"
            - name: KEYCLOAK_CLIENT_ID
              value: "inferx"
            - name: KEYCLOAK_CLIENT_SECRET
              value: "a6x8BeKBqhRcFU0WS3enUG8szkpgphJC"
            - name: INFERX_APIGW_ADDR
              value: "http://gateway:4000"
          volumeMounts:
            - name: cert-volume
              mountPath: /etc/letsencrypt/
          livenessProbe:
            httpGet:
              path: /demo/
              port: 1250
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: cert-volume
          hostPath:
            path: /etc/letsencrypt/
---
apiVersion: v1
kind: Service
metadata:
  name: inferx-dashboard
spec:
  type: NodePort
  selector:
    app: inferx-dashboard
  ports:
    - name: http
      port: 1250
      targetPort: 1250
      nodePort: 31250  