apiVersion: v1
kind: Secret
metadata:
  name: minio-hyperstack-config
  namespace: minio-hyperstack
stringData:
  config.env: |-
    export MINIO_ROOT_USER="admin"
    export MINIO_ROOT_PASSWORD="InferX-MinIO-Hyperstack-2025"
    export MINIO_BROWSER="on"
type: Opaque
---
apiVersion: v1
data:
  CONSOLE_ACCESS_KEY: YWRtaW4=
  CONSOLE_SECRET_KEY: SW5mZXJYLU1pbklPLUh5cGVyc3RhY2stMjAyNQ==
kind: Secret
metadata:
  name: minio-hyperstack-console
  namespace: minio-hyperstack
type: Opaque
---
apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: minio-hyperstack
  namespace: minio-hyperstack
  labels:
    app: minio-hyperstack
spec:
  configuration:
    name: minio-hyperstack-config
  image: quay.io/minio/minio:latest
  imagePullSecret: {}
  pools:
  - name: pool-0
    servers: 1
    volumesPerServer: 1
    volumeClaimTemplate:
      apiVersion: v1
      kind: persistentvolumeclaims
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 2000Gi
        storageClassName: local-path
    # Node affinity to GPU node with minio-node=true label
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: minio-node
              operator: In
              values:
              - "true"
    # Tolerate GPU taint to run on GPU node
    tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      runAsNonRoot: true
      fsGroupChangePolicy: OnRootMismatch
    containerSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
  mountPath: /export
  requestAutoCert: true
  users:
  - name: minio-hyperstack-console
