## MinIO-AWS configuration for InferX cluster
## HA deployment on AWS nodes for centralized storage

mode: distributed  # HA mode with erasure coding
replicas: 4  # Minimum for distributed mode

## Credentials
rootUser: minioadmin
rootPassword: minioadmin123  # Change this in production!

## Resource configuration (lightweight per replica)
resources:
  requests:
    memory: 1Gi
    cpu: 250m
  limits:
    memory: 2Gi
    cpu: 500m

## Persistence (per replica)
persistence:
  enabled: true
  storageClass: "ebs-csi-default-sc"
  accessMode: ReadWriteOnce
  size: 50Gi  # 50GB × 4 replicas = 200GB total with redundancy

## Service configuration
service:
  type: ClusterIP
  port: 9000

## Console (MinIO Web UI)
consoleService:
  type: ClusterIP
  port: 9001

## Node affinity - deploy on AWS nodes only
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: cloud
          operator: In
          values:
          - aws

## Buckets to create on startup
buckets:
  - name: inferx-logs
    policy: none
    purge: false
  - name: inferx-models
    policy: none
    purge: false
  - name: branding
    policy: none
    purge: false

## Users to create
users:
  - accessKey: inferx-access
    secretKey: inferx-secret-key-change-me
    policy: readwrite

## Policies
policies: []

## Deploy in default namespace (or create 'minio' namespace)
namespace: default
