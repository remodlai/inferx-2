## MinIO-Hyperstack configuration for InferX cluster
## Standalone deployment on dedicated Hyperstack CPU node
## Provides fast local storage for Hyperstack GPU workers

mode: standalone  # Single instance with Hyperstack volumes

## Credentials (should match AWS MinIO for replication)
rootUser: minioadmin
rootPassword: minioadmin123  # Change this in production!

## Resource configuration (lightweight)
resources:
  requests:
    memory: 1Gi
    cpu: 500m
  limits:
    memory: 2Gi
    cpu: 1000m

## Persistence - uses Hyperstack block storage
persistence:
  enabled: true
  storageClass: "local-path"  # Or create Hyperstack-specific storage class
  accessMode: ReadWriteOnce
  size: 2000Gi  # 2TB total (models + snapshots + logs + scratch)

## Service configuration
service:
  type: ClusterIP
  port: 9000

## Console (MinIO Web UI)
consoleService:
  type: ClusterIP
  port: 9001

## Node affinity - deploy on dedicated Hyperstack CPU node
## (Create dedicated node with label: minio-node=true)
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: cloud
          operator: In
          values:
          - hyperstack
        - key: minio-node
          operator: In
          values:
          - "true"

## Buckets to create on startup
buckets:
  - name: inferx-models
    policy: none
    purge: false
  - name: inferx-snapshots
    policy: none
    purge: false
  - name: inferx-cache
    policy: none
    purge: false

## Users (same credentials as AWS MinIO for compatibility)
users:
  - accessKey: inferx-access
    secretKey: inferx-secret-key-change-me
    policy: readwrite

## Deploy in minio namespace
namespace: minio

## Notes:
## - Designed for Hyperstack GPU workers to mount via goofys
## - Fast internal VPC networking within Hyperstack
## - Can replicate from MinIO-AWS using mc mirror
## - Hyperstack volumes are block storage (single attachment)
## - MinIO runs on dedicated CPU node, exposes S3 API
## - GPU workers mount buckets over network (not direct volume attachment)
