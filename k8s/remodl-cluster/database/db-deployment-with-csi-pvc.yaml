apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-csi-default-sc
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      nodeSelector:
        inferx-postgres: "true"      
      containers:
        - name: postgres
          image: inferx/inferx_postgres:v0.1.5.beta37
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: audit_user
            - name: POSTGRES_PASSWORD
              value: "123456"
            - name: POSTGRES_DB
              value: auditdb
            - name: PGDATA
              value: /data/postgres/pgdata
            - name: INIT_SQL
              value: create_table.sql  
          volumeMounts:
            - name: db-data
              mountPath: /data/postgres
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30542
  type: NodePort
