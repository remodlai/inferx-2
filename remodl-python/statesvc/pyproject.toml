[project]
name = "inferx-statesvc"
version = "0.2.0"
description = "InferX StateSvc - Temporal-based state management service"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Remodl AI", email = "brian@remodl.ai"}
]

dependencies = [
    "temporalio>=1.21.1",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "asyncpg>=0.31.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
