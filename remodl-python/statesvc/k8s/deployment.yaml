apiVersion: apps/v1
kind: Deployment
metadata:
  name: statesvc-temporal
  namespace: default
  labels:
    app: statesvc-temporal
    component: statesvc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: statesvc-temporal
  template:
    metadata:
      labels:
        app: statesvc-temporal
        component: statesvc
    spec:
      hostPID: true
      nodeSelector:
        inferx-cpu-worker: "true"
      containers:
      - name: statesvc
        image: remodlai/inferx-statesvc:latest
        imagePullPolicy: Always
        ports:
        - name: grpc
          containerPort: 1237
          protocol: TCP
        envFrom:
        - configMapRef:
            name: statesvc-config
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: statesvc-secrets
              key: database-url
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        livenessProbe:
          tcpSocket:
            port: 1237 # temporal port for health check
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 1237
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - mountPath: /opt/inferx/log
          name: opt-inferx-log
      volumes:
      - name: opt-inferx-log
        hostPath:
          path: /opt/inferx/log
