apiVersion: v1
kind: ConfigMap
metadata:
  name: statesvc-config
  namespace: default
data:
  # Temporal connection
  TEMPORAL_TARGET_HOST: "flow.remodl.ai:443"
  TEMPORAL_NAMESPACE: "inferx"
  TEMPORAL_TLS: "true"
  TEMPORAL_TASK_QUEUE: "statesvc-tasks"

  # StateSvc configuration
  STATESVC_HOST: "0.0.0.0"
  STATESVC_PORT: "1237"

  # Logging
  LOG_LEVEL: "INFO"
