[project]
name = "inferx-common"
version = "0.1.0"
description = "Shared models and utilities for InferX services"
requires-python = ">=3.12"
authors = [
    {name = "Remodl AI", email = "brian@remodl.ai"}
]

dependencies = [
    "pydantic>=2.12.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inferx_common"]
