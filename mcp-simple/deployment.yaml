apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-simple
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-simple
  template:
    metadata:
      labels:
        app: mcp-simple
    spec:
      containers:
      - name: server
        image: remodlai/mcp-simple:latest
        ports:
        - containerPort: 8080
          name: sse
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-simple
  namespace: default
spec:
  selector:
    app: mcp-simple
  ports:
  - port: 8080
    targetPort: 8080
    name: sse
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-simple-ingress
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - mcp.remodl.ai
    secretName: mcp-proxy-tls
  rules:
  - host: mcp.remodl.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mcp-simple
            port:
              number: 8080
